<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteio · Além da Norma</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1F35; --navy-panel:#12293F; --navy-panel-2:#16304A; --gold:#B8976A; --gold-soft:#D9C3A0;
    --white:#fff; --ink-soft:rgba(255,255,255,.7); --ink-faint:rgba(255,255,255,.45); --line:rgba(184,151,106,.25);
    --success:#4CAF7B; --error:#E2725B;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--navy); color:#fff; font-family:'Inter', sans-serif; }
  .wrap{ max-width: 720px; margin:0 auto; padding: 24px 20px 60px; }
  header{ display:flex; align-items:center; gap:10px; padding:12px 0 26px; }
  header img{ width:26px; height:26px; display:block; }
  header span{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); }

  .gate{ max-width:320px; margin: 90px auto; text-align:center; }
  .gate p{ color:var(--ink-soft); font-size:14px; margin-bottom:16px; }
  .gate input{ width:100%; background:var(--navy-panel); border:1px solid rgba(255,255,255,.14); border-radius:4px; color:#fff; padding:12px 14px; font-size:15px; text-align:center; margin-bottom:12px; box-sizing:border-box; }
  .gate button{ width:100%; background:var(--gold); color:var(--navy); border:none; border-radius:4px; padding:12px; font-weight:600; font-size:14px; cursor:pointer; }
  .gate .err{ color:var(--error); font-size:12.5px; margin-top:10px; display:none; }

  .app{ display:none; text-align:center; }
  .app.show{ display:block; }

  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:26px; margin:0 0 6px; }
  .sub{ color:var(--ink-soft); font-size:14px; margin:0 0 8px; }
  .pool-count{ color:var(--gold-soft); font-size:13px; margin-bottom:30px; }
  .pool-count b{ font-family:'Fraunces', serif; font-size:20px; color:var(--gold); font-weight:600; }

  .sortear-btn{
    background:var(--gold); color:var(--navy); border:none; border-radius:6px;
    padding:18px 40px; font-weight:700; font-size:17px; cursor:pointer;
    box-shadow: 0 8px 24px rgba(184,151,106,0.25);
    transition: transform .15s ease;
  }
  .sortear-btn:hover{ transform: translateY(-2px); }
  .sortear-btn:disabled{ opacity:.5; cursor:default; transform:none; }

  .actions{ margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .actions button{ background:transparent; border:1px solid rgba(255,255,255,.2); color:var(--ink-soft); border-radius:4px; padding:10px 18px; font-size:13px; cursor:pointer; }
  .actions button:hover{ border-color:var(--gold); color:#fff; }

  .status{ margin-top:16px; font-size:13px; color:var(--error); display:none; }
  .status.show{ display:block; }

  .winners{ margin-top:34px; text-align:left; }
  .winner{
    display:flex; align-items:center; gap:14px;
    background:var(--navy-panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 18px; margin-bottom:10px;
    opacity:0; transform:translateY(12px);
    animation: reveal .5s ease forwards;
  }
  .winner .num{
    font-family:'Fraunces', serif; font-size:22px; color:var(--gold);
    width:36px; text-align:center; flex-shrink:0;
  }
  .winner .info strong{ display:block; font-size:15px; }
  .winner .info span{ font-size:12.5px; color:var(--ink-faint); }
  @keyframes reveal{ to{ opacity:1; transform:translateY(0); } }

  @media (prefers-reduced-motion: reduce){
    .winner{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
